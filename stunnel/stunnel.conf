setuid = stunnel4
setgid = stunnel4
pid = /var/run/stunnel4/stunnel.pid
output = /var/log/stunnel4/stunnel.log
debug = info

# Performance and Reliability
socket = l:TCP_NODELAY=1
socket = r:TCP_NODELAY=1

# Modern TLS defaults
sslVersion = TLSv1.3
options = NO_SSLv2
options = NO_SSLv3
options = NO_TLSv1
options = NO_TLSv1.1

include = /etc/stunnel/conf.d
