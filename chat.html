<!DOCTYPE html>
<html>
<head>
    <title>Unified Chat - PrismRTMPS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: rgba(0,0,0,0.1);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #chat-window {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 20px;
        }
        .message {
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .platform-icon {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .user {
            font-weight: bold;
            margin-right: 5px;
            color: #efeff1;
        }
        .text {
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.4;
        }
        #auth-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .login-btn {
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .twitch-btn { background: #9146FF; }
        .youtube-btn { background: #FF0000; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="auth-panel">
        <a id="twitch-login" href="/login/twitch" target="_blank" class="login-btn twitch-btn hidden">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Twitch_Glitch_Logo_Purple.svg" style="filter: brightness(0) invert(1);" width="14"> Login Twitch
        </a>
        <a id="youtube-login" href="/login/youtube" target="_blank" class="login-btn youtube-btn hidden">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" width="14"> Login YouTube
        </a>
    </div>

    <div id="chat-window">
        <div id="messages"></div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const twitchBtn = document.getElementById('twitch-login');
        const youtubeBtn = document.getElementById('youtube-login');

        let lastMessageId = null;
        const icons = {
            twitch: 'https://upload.wikimedia.org/wikipedia/commons/d/d3/Twitch_Glitch_Logo_Purple.svg',
            youtube: 'https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg'
        };

        async function fetchMessages() {
            try {
                const response = await fetch('/chat/messages');
                const data = await response.json();

                // Handle Auth Buttons
                if (!data.authenticated.twitch) twitchBtn.classList.remove('hidden');
                else twitchBtn.classList.add('hidden');

                if (!data.authenticated.youtube) youtubeBtn.classList.remove('hidden');
                else youtubeBtn.classList.add('hidden');

                // Render Messages
                const newMessages = data.messages;
                if (newMessages.length > 0) {
                    const latest = newMessages[newMessages.length - 1];
                    if (latest.id !== lastMessageId) {
                        renderAllMessages(newMessages);
                        lastMessageId = latest.id;
                    }
                }
            } catch (e) {
                console.error("Failed to fetch messages", e);
            }
        }

        function renderAllMessages(messages) {
            messagesDiv.innerHTML = '';
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message';

                const icon = document.createElement('img');
                icon.className = 'platform-icon';
                icon.src = icons[msg.source] || '';

                const content = document.createElement('div');
                content.innerHTML = `<span class="user">${msg.user}:</span><span class="text">${msg.text}</span>`;

                div.appendChild(icon);
                div.appendChild(content);
                messagesDiv.appendChild(div);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        setInterval(fetchMessages, 2000);
        fetchMessages();
    </script>
</body>
</html>
