<!DOCTYPE html>
<html>
<head>
    <title>Combined Chat</title>
    <style>
        body { margin: 0; padding: 0; background: transparent; overflow: hidden; display: flex; height: 100vh; }
        iframe { border: none; flex: 1; height: 100%; }
    </style>
</head>
<body>
    <div id="chat-container" style="display: flex; width: 100%; height: 100%;">
        <!-- Embeds will be added here -->
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const twitchChannel = urlParams.get('twitch');
        const youtubeId = urlParams.get('youtube');
        const container = document.getElementById('chat-container');

        if (twitchChannel) {
            const twitchIframe = document.createElement('iframe');
            twitchIframe.src = `https://www.twitch.tv/embed/${twitchChannel}/chat?parent=${window.location.hostname || 'localhost'}`;
            container.appendChild(twitchIframe);
        }

        if (youtubeId) {
            const youtubeIframe = document.createElement('iframe');
            youtubeIframe.src = `https://www.youtube.com/live_chat?v=${youtubeId}&embed_domain=${window.location.hostname || 'localhost'}`;
            container.appendChild(youtubeIframe);
        }
    </script>
</body>
</html>
