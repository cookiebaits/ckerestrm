<!DOCTYPE html>
<html>
<head>
    <title>PrismRTMPS - Control Dashboard</title>
    <style>
        body { margin: 0; padding: 20px; background: #0e0e10; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .login-buttons { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        .btn-twitch { background: #9146ff; color: white; }
        .btn-youtube { background: #ff0000; color: white; }
        .btn-update { background: #00ff7f; color: black; }
        
        .main-content { display: flex; gap: 20px; flex-grow: 1; overflow: hidden; }
        .chat-section { flex: 2; display: flex; flex-direction: column; background: #18181b; border-radius: 8px; overflow: hidden; }
        .chat-header { padding: 10px; background: #26262c; display: flex; gap: 10px; }
        .chat-container { display: flex; flex-grow: 1; gap: 1px; background: #26262c; }
        .chat-column { flex: 1; background: #0e0e10; position: relative; }
        
        .control-section { flex: 1; background: #18181b; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        input[type="text"] { background: #26262c; border: 1px solid #3f3f46; color: white; padding: 10px; border-radius: 4px; }
        
        .platform-icon { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; opacity: 0.8; z-index: 5; }
        iframe { border: none; width: 100%; height: 100%; }
        .status-badge { font-size: 0.8em; padding: 2px 6px; border-radius: 10px; }
        .status-online { background: #00ff7f; color: black; }
        .status-offline { background: #3f3f46; color: #a1a1aa; }
    </style>
</head>
<body>
    <div class="header">
        <h1>PrismRTMPS Dashboard</h1>
        <div class="login-buttons">
            <span id="twitch-status" class="status-badge status-offline">Twitch Offline</span>
            <a href="/login/twitch" class="btn btn-twitch">Login Twitch</a>
            <span id="youtube-status" class="status-badge status-offline">YouTube Offline</span>
            <a href="/login/youtube" class="btn btn-youtube">Login YouTube</a>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-section">
            <div class="chat-header">Combined Stream Chat</div>
            <div class="chat-container" id="chat-container">
                <!-- Chats will be injected here -->
            </div>
        </div>

        <div class="control-section">
            <h3>Stream Control</h3>
            <div class="input-group">
                <label>Update Stream Title (Unified)</label>
                <input type="text" id="stream-title" placeholder="Enter new title...">
                <button onclick="updateTitle()" class="btn btn-update">Sync Title</button>
            </div>
            <div id="update-msg"></div>
        </div>
    </div>

    <script>
        async function checkStatus() {
            const r = await fetch('/api/status');
            const status = await r.json();
            
            const container = document.getElementById('chat-container');
            container.innerHTML = '';

            if (status.twitch) {
                document.getElementById('twitch-status').innerText = `Twitch: ${status.twitch}`;
                document.getElementById('twitch-status').className = 'status-badge status-online';
                addChatColumn('twitch', `https://www.twitch.tv/embed/${status.twitch}/chat?parent=${window.location.hostname || 'localhost'}&darkpopout`, 'https://upload.wikimedia.org/wikipedia/commons/d/d3/Twitch_Glitch_Logo_Purple.svg');
            }

            if (status.youtube) {
                document.getElementById('youtube-status').innerText = `YouTube: ${status.youtube}`;
                document.getElementById('youtube-status').className = 'status-badge status-online';
                // Note: YouTube chat embed requires Video ID which we don't have from just the user profile.
                // This is a placeholder. In a real scenario, you'd fetch the active broadcast.
                addChatColumn('youtube', 'about:blank', 'https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg');
            }
        }

        function addChatColumn(id, url, icon) {
            const col = document.createElement('div');
            col.className = 'chat-column';
            col.innerHTML = `
                <img src="${icon}" class="platform-icon">
                <iframe src="${url}"></iframe>
            `;
            document.getElementById('chat-container').appendChild(col);
        }

        async function updateTitle() {
            const title = document.getElementById('stream-title').value;
            const msg = document.getElementById('update-msg');
            msg.innerText = 'Updating...';
            
            const r = await fetch('/api/update_title', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });
            const res = await r.json();
            msg.innerText = `Update Status - Twitch: ${res.twitch ? 'Success' : 'Failed'}, YouTube: ${res.youtube}`;
        }

        checkStatus();
    </script>
</body>
</html>
